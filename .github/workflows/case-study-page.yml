name: Case study page

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/case-study-page.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-demo-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish the case study destination
        id: deployment
        uses: actions/deploy-pages@v4
