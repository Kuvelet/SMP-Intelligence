name: Live demo

on:
  push:
    branches: [main]
    paths:
      - 'sample/**'
      - 'scripts/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/live-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-demo-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - name: Test the shared C# pipeline
        run: |
          dotnet restore SmpSample.slnx --locked-mode
          dotnet test SmpSample.slnx --no-restore --configuration Release
      - name: Prepare and test browser assets
        run: |
          python3 scripts/prepare-browser.py --base-path /SMP-Intelligence/
          node --test scripts/browser-database.test.mjs
      - name: Publish the WebAssembly demo
        run: |
          dotnet restore sample/Smp.Sample.Browser --locked-mode
          dotnet publish sample/Smp.Sample.Browser --no-restore --configuration Release --output artifacts/browser
      - uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/browser/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the live demo
        id: deployment
        uses: actions/deploy-pages@v4
